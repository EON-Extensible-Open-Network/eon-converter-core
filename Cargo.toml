[package]
name = "eon-converter-core"
description = "The EON Converter core: format detection, a routing graph over conversion engines, and the engines. No GUI dependency."
# Tag v0.0.0 -> 0.0.0-alpha.
version = "0.0.0-alpha"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/EON-Extensible-Open-Network/eon-converter-core"
publish = false

# Every dependency is a supply-chain commitment (madde 37).
[dependencies]
# Running the engines (separate programs), reading their progress, cancelling.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
# Fetching the engines the first time they are needed, over rustls with the ring
# provider, as EON Download Manager does: no OpenSSL, no C build of aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Checking every fetched engine against the SHA-256 pinned in tools.rs.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Telling what a file is from its first bytes, before trusting its name.
infer = "0.22"
# Conversions the core does itself, with no engine to fetch:
# text files in whatever encoding they were saved in (UTF-16, Windows-1254),
encoding_rs = "0.8"
# images,
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "qoi", "pnm", "hdr", "dds"] }
# data formats,
csv = "1"
toml = "1"
serde_yaml_ng = "0.10"
quick-xml = "0.42"
# spreadsheets (read: XLSX, XLS, XLSB, ODS; write: XLSX),
calamine = { version = "0.38", features = ["dates"] }
# The dates calamine reads, written as dates.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_xlsxwriter = "0.103"
# archives (ZIP, TAR, TAR.GZ), and unpacking the engines' own archives.
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# Reading PDF (text with its font sizes, page images) through Google's PDFium,
# loaded at run time from the copy tools.rs fetched.
pdfium-render = { version = "0.9", default-features = false, features = ["image_025", "thread_safe", "pdfium_latest"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
