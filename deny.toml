#
# cargo-deny: supply chain and licence gate (madde 37).
# A dependency is a commitment; this file makes the commitment explicit.

[advisories]
yanked = "deny"
# RUSTSEC-2026-0543 -- chrono is unmaintained. Not a vulnerability: a notice that
# fixes will stop coming. Checked rather than waved through, as eon-stream-engine
# did for the same advisory. Two paths, neither parses outside text:
# - pdfium-render 0.9.6 depends on chrono unconditionally, and uses it only to
#   *format* a date when setting an annotation's or form field's creation or
#   modification date (utils.rs `date_time_to_pdf_string`). This crate only reads
#   PDFs (text and page pictures) and never calls those setters.
# - calamine's `dates` feature: we call only `ExcelDateTime::as_datetime`
#   (engine/core.rs), which adds the cell's serial number to a fixed epoch --
#   arithmetic, no string parsing. `as_date`/`as_time`, which parse strings with
#   chrono, are not called.
# There is no upgrade: the advisory lists no safe version. Remove this when
# pdfium-render moves to another time crate, or drop `dates` and convert the
# serial number here if calamine stays on chrono alone.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
# Our own crate is copyleft and unpublished; the allow list below governs
# DEPENDENCIES, which must stay permissive.
private = { ignore = true }

# GPL-3.0-or-later project: permissive inbound licences only. A copyleft
# dependency with a different reciprocity than ours is a decision, not a default,
# and must be added here deliberately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    # The CA root bundle (webpki-root-certs), reached through rustls-platform-
    # verifier where the system has no usable trust store of its own.
    # CDLA-Permissive-2.0 is a licence for *data* -- a list of certificate
    # authorities -- that attaches no conditions to downstream use. As in
    # eon-download-manager-app and eon-stream-engine: the alternative is a TLS
    # stack with no trust roots.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
